# Dataset preparation and per-step capacity. Training: config/train.yaml. Eval: config/eval.yaml.

seed: 42

paths:
  data_source: staging                    # staging | data — which storage tier to read/write
  raw: data/raw
  processed: data/processed
  dedup: output/manifests/dedup
  manifest_pd: output/manifests/manifest_pd.csv
  manifest_lgd: output/manifests/manifest_lgd.csv

finetuning:
  max_rows_per_epoch:                     # rows per TRAINING step (context+query), PD 2-member
    v2:      9000                         # UNPROBED — 7.2M params, architectural cap ~10k rows
    v2.6:    18000                        # probed 30k=169G on a 183G B200; 18k leaves 45% free
    v3:      40000                        # probed 50k=125G; 40k leaves 45% free
    tabicl:  26000                        # cuDNN fused attention fails at 40k — not memory
    default: 18000                        # the most conservative real value, not the largest
  max_cells_per_epoch:                    # optional rows x features budget; null = off
    v3: null
    v2.6: null
    default: null
  context_sampling: balanced              # stratified | balanced — per-class draw for the context
  query_fraction: 0.2                     # default only; the sweep sets this per trial

sanitize:
  max_missing_rate: 0.9                   # drop a column above this fraction of missing cells
  coerce_numeric_strings: true
  coerce_numeric_threshold: 0.95          # fraction parseable before a column is coerced
  max_columns: 64                         # feature cap, applied by selection below
  feature_selection: {enabled: true, corr_threshold: 0.95}
  lgd_target_clip: {enabled: true, lower: 0.0, upper: 1.0}

dedup:                                    # cross-dataset duplicate detection; see docs/METHOD.md
  name_jaccard_threshold: 0.8
  row_hash_intersection_min: 1
  shared_columns_min: 3
  column_nontrivial_unique_min: 10
  rounded_row: {enabled: true, decimals: 6}
  subset: {enabled: true, min_overlap_fraction: 0.95}
  column_name_fuzzy: {enabled_pre: true, enabled_post: false, similarity_threshold: 90}
  confidence_rules:
    high: [id_match, row_hash]
    medium: [col_hash, name_jaccard_and_shape]
    low: [rounded_row, subset, fuzzy_names]
