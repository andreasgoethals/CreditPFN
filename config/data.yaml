# =============================================================================
#  CreditPFN — data-pipeline configuration
# =============================================================================
#  Tunable knobs only; always-on policy is hardcoded in the stage modules.
#  CLI overrides Hydra-style: `data_pipeline.py finetuning.max_rows_per_epoch=5000`.
#  Full walkthrough of every stage in docs/DATA_PIPELINE.md.
# =============================================================================

# Global seed — every stage derives a deterministic local seed from this.
seed: 42

# Paths (resolved by src.utils.paths):
#   data_source picks the corpus tier — "scratch" (VSC fast-purge) or "data"
#   (VSC durable / repo root locally). dedup + manifests are ALWAYS durable.
paths:
  data_source:   "data"            # "scratch" | "data"
  raw:           data/raw          # data/raw/{pd,lgd}/<id>.csv
  processed:     data/processed    # sanitize.py output — the on-disk training input
  dedup:         data/dedup        # doubles_*_{pre,post}.csv (always durable)
  manifest_pd:   data/manifest_pd.csv
  manifest_lgd:  data/manifest_lgd.csv


# --- Finetuning subsample ----------------------------------------------------
# Rows pulled per training step from a dataset's processed CSV (the in-context
# "training" set the model conditions on while finetuning). Per-architecture
# cap because v2.6's alternating attention is far more memory-hungry than v3's
# 3-stage design (v2.6 OOMs on an 80 GB H100 above ~3 000 rows).
#
# NOTE (2026-06-01): v3 was bumped to 20 000 to chase Real-TabPFN's "more
# context → bigger gains" (§5), but that **OOM'd v3 full-finetuning** (no-LoRA)
# on the 80 GB H100 — all 6 v3 no-LoRA PD trials failed with CUDA OOM (LoRA
# trials fit because the base is frozen). Reverted to 10 000, the value that
# trained cleanly in the earlier full-FT run. To push higher, either restrict
# to LoRA, or enable the v3 cell budget below (and validate OOM first). v2.6
# stays at 6 000 (all v2.6 trials trained fine there). cells = rows × features
# drive memory, so sanitize.max_columns also bounds how high rows can go.
# Key = leading v<MAJOR>[.<MINOR>] of the base filename.
finetuning:
  max_rows_per_epoch:
    v3:      10000
    v2.6:    6000
    default: 10000
  # Optional CELL budget (rows × features). When non-null for a base, the
  # per-step row count = min(max_rows_per_epoch, max_cells // n_features) —
  # narrow datasets get more rows, wide ones fewer, at ~constant cells.
  # ARCHITECTURE NOTE (why per-base): this fits v3 — TabPFN-3's capacity is a
  # "cell-budget frontier" (report §2.4: 1M rows@200 feat ≡ 100k@2000 feat),
  # its 3-stage design decouples the ICL stage from feature count and
  # row-chunks activation memory. It is NOT right for v2.6, whose dual
  # attention costs O(r²·c + r·c²) — QUADRATIC in rows — so v2.6 stays on a
  # pure row cap. null → off (pure row cap, current behaviour). To enable for
  # v3: set v3 to a budget AND raise max_rows_per_epoch.v3 to the row ceiling
  # narrow datasets may reach (e.g. cells 8000000, rows 100000). VALIDATE OOM
  # on the H100 before a full sweep.
  max_cells_per_epoch:
    v3:      null
    v2.6:    null
    default: null
  query_fraction:     0.20


# --- sanitize.py — dataset-agnostic cleaning ---------------------------------
sanitize:
  max_missing_rate: 0.90                  # drop columns more NaN than this
  coerce_numeric_strings: true            # cast mostly-numeric object cols
  coerce_numeric_threshold: 0.95          # ...if this fraction parses
  max_columns: 64                         # feature-count cap (selection; see below)
  # Cap the feature count by UNSUPERVISED SELECTION of real columns (top by
  # scale-free variance, greedily de-correlated) — NOT by averaging into
  # cluster means. Keeps real marginals/interactions so continued pretraining
  # specialises the prior toward genuine credit features. corr_threshold drops
  # a column when |Pearson r| with a kept column exceeds it. See docs/DATA_PIPELINE.md.
  feature_selection:
    enabled: true
    corr_threshold: 0.95
  lgd_target_clip:                        # LGD ∈ [0,1] by definition
    enabled: true
    lower: 0.0
    upper: 1.0


# --- dedup.py — within-track duplicate detection (diagnostic only) -----------
# Writes a report per (track, pass); never removes datasets. See
# docs/DATA_PIPELINE.md § dedup.
dedup:
  name_jaccard_threshold: 0.80            # check 2: col-name Jaccard + same shape
  row_hash_intersection_min: 1            # check 3: shared row hashes
  shared_columns_min: 3                   # check 4: shared non-trivial columns
  column_nontrivial_unique_min: 10
  rounded_row:                            # extra A: float-precision near-dupes
    enabled: true
    decimals: 6
  subset:                                 # extra B: |A∩B|/|A| ≥ frac ⇒ A ⊆ B
    enabled: true
    min_overlap_fraction: 0.95
  column_name_fuzzy:                      # extra C: fuzzy col-name (pre-sanitize only)
    enabled_pre: true
    enabled_post: false
    similarity_threshold: 90              # rapidfuzz token-set ratio 0–100
  confidence_rules:                       # triggered-checks → label (first match wins)
    high:   ["id_match",    "row_hash"]
    medium: ["col_hash",    "name_jaccard_and_shape"]
    low:    ["rounded_row", "subset", "fuzzy_names"]
