# EXPERIMENT 2 · PD — does it help when every training table is large?
# The 11 PD datasets above the 3.13x row-count break; biggest 6 train, smallest 5 test.
# One fixed split: resampling would reintroduce the small tables this excludes.

# ---------------------------------------------------------------- SWEPT ------
tunable:
  learning_rates: [1.0e-6, 1.0e-5]                    # control, not the variable
  l2sp_lambdas: [0.003]
  frozen_backbone: [false]
  epoch_pass_modes: ["full_pass"]
  query_fractions: [0.40]
  accumulate_grad_batches: [1]

corpus:
  # Experiment intent: every TRAIN table is large. Selected BY ROW COUNT, never by name, so no
  # dataset (least of all a proprietary one) is named in a tracked config — see the privacy rules.
  # NOTE (21-09): this replaced explicit slug pins; exp2 is NOT the active experiment, so validate
  # the resulting train/test composition (and assert the expected counts) before running it.
  min_train_rows: 150000      # train = all PD tables at/above this row count
  n_test_datasets: 5          # remaining large tables drawn as test
  n_splits: 1

# ---------------------------------------------------------------- FIXED ------
track: "pd"
run_name: "exp2"

train:
  context_sampling: stratified
  target_total_steps: 5000    # same budget as experiment 1, so the two are comparable
  epochs: 50                  # fallback only
  max_epochs_for_step_budget: 4000
  epoch_eval_count: 20
