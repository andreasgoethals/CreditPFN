# EXPERIMENT 2 · PD — does it help when every training table is large?
# The 11 PD datasets above the 3.13x row-count break; biggest 6 train, smallest 5 test.
# One fixed split: resampling would reintroduce the small tables this excludes.

# ---------------------------------------------------------------- SWEPT ------
tunable:
  learning_rates: [1.0e-6, 1.0e-5]                    # control, not the variable
  l2sp_lambdas: [0.003]
  frozen_backbone: [false]
  epoch_pass_modes: ["full_pass"]
  query_fractions: [0.40]
  accumulate_grad_batches: [1]

corpus:
  min_train_rows: 0           # not an axis any more: the split draw varies table sizes
  n_test_datasets: null       # pinned below
  n_splits: 1
  train_dataset_ids:          # all >= 150 000 rows
    pd: ["0016.bondora_peer2peer", "0006.hackerearth", "0012.home_credit",
         "0003.vehicle_loan", "0014.algorithmwatch", "0001.gmsc"]
  test_dataset_ids:           # all >= 30 000 rows
    pd: ["0011.loan_default", "0009.bank_status", "0007.cobranded",
         "0015.credit_risk_dataset", "0002.taiwan_creditcard"]

# ---------------------------------------------------------------- FIXED ------
track: "pd"
run_name: "exp2"

train:
  epochs: 100
  target_total_steps: null
  monitor_every: 5
  early_stopping: false
  early_stopping_patience: 20
  log_would_stop: true
