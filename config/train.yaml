# Machinery defaults for continued pretraining. Every experiment config is a DELTA over this
# file, so anything an experiment does not mention is taken from here.
# What each knob DOES and why it has this value: docs/METHOD.md.

# ---------------------------------------------------------------- SWEPT ------
# Overridden per experiment. These values reproduce run-8.
tunable:
  learning_rates: [3.0e-7, 1.0e-6]
  l2sp_lambdas: null                      # null = use optimizer.l2sp_lambda, not an axis
  frozen_backbone: [false, true]          # head only, or every weight
  use_lora: [false, true]                 # legacy name for frozen_backbone
  adapter_families: ["tabicl"]            # families that get the frozen arm; [] = all
  query_fractions: [0.40]                 # fraction of each step's rows that carry the loss
  accumulate_grad_batches: [1]            # steps summed into one optimizer update
  epoch_pass_modes: ["full_pass"]         # full_pass = all rows/epoch; one_sample = 1 step/dataset
  classifier_base_paths:
    - "checkpoints/tabpfn-v3-classifier-v3_default.ckpt"
    - "checkpoints/tabpfn-v2.6-classifier-v2.6_default.ckpt"
    - "checkpoints/tabicl-classifier-v2-20260212.ckpt"
  regressor_base_paths:
    - "checkpoints/tabpfn-v3-regressor-v3_default.ckpt"
    - "checkpoints/tabpfn-v2.6-regressor-v2.6_default.ckpt"
    - "checkpoints/tabicl-regressor-v2-20260212.ckpt"

corpus:
  min_train_rows: 0                       # drop training tables below this many rows
  n_test_datasets: null                   # random draw of this many test datasets
  n_folds: null                           # or K-fold over datasets instead of a draw
  fold: 0
  n_splits: 1                             # how many draws run_experiment.sh iterates
  split_seed: null                        # defaults to `seed`; separate so splits vary alone
  train_fraction: 0.7                     # fallback when no draw and no pins
  test_fraction: 0.3
  train_dataset_ids: null                 # pin instead of drawing; per-track mapping allowed
  test_dataset_ids: null

# ---------------------------------------------------------------- FIXED ------
seed: 42
run_name: "creditpfn"
device: "auto"                            # auto | cuda | cpu
track: "pd"                               # pd = classifier, lgd = regressor

optimizer:
  weight_decay: 0.0                       # 0: L2-SP anchors to w0 instead of to the origin
  l2sp_lambda: 0.003                      # anchor strength when not swept (Garg 2025)

scheduler:
  warmup_fraction: 0.10                   # linear warmup, then cosine
  min_lr_fraction: 0.05                   # floor as a fraction of peak

lora:                                     # used only on the frozen arm for TabPFN
  r: 8
  alpha: 16
  dropout: 0.1
  target_modules: ["q_projection", "k_projection", "v_projection", "out_projection"]

train:
  epochs: 100                             # one epoch = one pass over the training corpus
  target_total_steps: 20000               # null = epochs govern; else epochs are trimmed/extended
  max_epochs_for_step_budget: 6000        # rail on the above, so no arm runs away
  grad_clip_norm: 1.0
  amp: true
  amp_dtype: "auto"                       # BF16 where supported
  dataloader_workers: 0                   # >0 deadlocks with the per-step CSV loader
  step_log_interval: 10
  n_estimators_finetune: {pd: 2, lgd: 8, default: 2}   # ensemble members per TRAINING step
  n_estimators_finetune_tabicl: 2         # TabICL's own finetuning default, both tracks
  epoch_eval_subsample_samples: 2000      # rows per dataset in the in-loop monitor
  epoch_eval_n_estimators: 32
  epoch_eval_n_estimators_tabicl: 8
  epoch_eval_every: 5                     # monitor cadence, in epochs
  divergence_patience: 5                  # epochs of flat loss AND flat drift before aborting
  early_stopping: false                   # fixed budget keeps training curves comparable
  early_stopping_patience: 20
  log_would_stop: true                    # record where patience would have fired
  log_grad_norm: true                     # per-step gradient norm, averaged per epoch
  log_per_layer_drift: true               # ||w-w0|| per layer, not just per stage

checkpoint:
  trained_dir: "checkpoints/trained"
