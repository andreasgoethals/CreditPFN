# Held-out benchmark: how every model is scored. Training: config/train.yaml.

train_cfg_path: config/train.yaml         # where the trained-checkpoint roster comes from
seed: 99                                 # fixed across training-seed repetitions

baselines:
  enabled: [catboost, logreg, linreg, tabpfn-untuned, tabicl-untuned]   # second campaign: CatBoost + logistic/linear only

cv:
  n_folds: 5                              # outer CV folds per dataset
  inner_val_fraction: 0.2                 # of the train fold, for threshold tuning

max_rows_per_model:                       # inference context cap; forward-only, so >> training
  v2: 10000                               # v2's OFFICIAL limit: >10k raises TabPFNValidationError
  #                                         (both untuned+trained v2 failed all folds on the big
  #                                         datasets at 50k, exp0 eval j11532735). Each generation
  #                                         is evaluated at its native supported context.
  v2.6: 50000
  v3: 1000000
  tabicl: 1000000
  default: 50000

tabpfn_n_estimators: 32                   # inference ensemble; 2 at training time is a memory limit
tabicl_n_estimators: 8

hpo:                                      # Optuna budget per classical baseline: exactly n_trials
  # seeded trials, no wall-clock timeout. A timeout made the trial count depend on node speed
  # (first study: logreg completed 12-50 trials, XGBoost 8-50), so reruns differed.
  xgboost: {n_trials: 50, timeout_seconds: null, max_rows: 50000}
  catboost: {n_trials: 50, timeout_seconds: null, max_rows: 50000}
  logreg: {n_trials: 50, timeout_seconds: null}
  linreg: {n_trials: 50, timeout_seconds: null}

results:
  base_dir: output CreditPFN/results                # resolved onto project storage by paths.py
  save_predictions: true                  # per-fold probabilities, for post-hoc analysis
