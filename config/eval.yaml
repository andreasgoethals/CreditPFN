# =============================================================================
#  CreditPFN — eval / final-benchmark configuration
# =============================================================================
#  Drives scripts/eval_pipeline.py: for each (model × test dataset) it runs
#  K-fold CV (outer 80/20, inner 80/20 of the train fold for HPO + F1-threshold
#  tuning) and writes one CSV per (method, run, ts) under results.base_dir.
#  Shared knobs (seed, run_name, track, corpus split) are inherited from
#  train.yaml. Full rationale for every knob lives in README §8 (Eval pipeline).
# =============================================================================

# Shared knobs (seed, run_name, track, corpus split) come from here.
train_cfg_path: "config/train.yaml"


# Classical baselines to score. "logreg" is ignored on lgd; "linreg" on pd.
# "<family>-untuned" expands to one entry per base of THAT family in
# tunable.<track>_base_paths, so each family's trained checkpoints have their
# own within-family control. Any baseline whose package is missing, or whose
# base .ckpt is absent, is skipped with a warning rather than failing the run.
baselines:
  enabled: ["xgboost", "catboost", "logreg", "linreg",
            "tabpfn-untuned", "tabicl-untuned"]


# Outer K-fold CV per test dataset (stratified for pd, plain KFold for lgd).
# inner_val_fraction carves a val split out of each train fold, shared by
# Optuna HPO and the F1-threshold tuner → 64/16/20 train/val/test.
cv:
  n_folds: 5
  inner_val_fraction: 0.20


# Per-architecture cap on TabPFN's in-context training rows (the upstream
# single-H100 limit; non-TabPFN baselines see the full train fold). Key =
# leading v<MAJOR> of the parsed base-stem; default is the fallback.
#   v3 → 1M rows (TabPFN-3 §2.4).
#   v2.6 → 50k (REDUCED from 100k, 2026-07-13): 50k is v2.6's PUBLISHED
#   design envelope (TabPFN-2.5 §"up to 50,000 data points"), and its dual
#   attention is O(rows²) — at 100k in-context rows a single v2.6 ×
#   algorithmwatch fold took ~40 min on an A100, so all 8 such eval cells
#   blew the 2 h walltime in the Jul-12 run. 50k stays inside the envelope
#   and cuts the quadratic term 4×.
#   tabicl → 1M, same as v3 (CORRECTED 2026-08-04; was 50k). Million-scale
#   in-context inference is TabICLv2's headline capability, not a stretch
#   goal: Qu et al. 2026 report processing **1M samples × 500 features in
#   ~450 s under 50 GB GPU + 24 GB CPU** via hierarchical CPU/disk
#   offloading, and 10.6x faster than TabPFN-2.5 on an H100 at 50k samples.
#   Their QASSMax (scalable softmax, attention logits x s·log n) exists
#   precisely to keep attention sharp at long context, so they "natively
#   handle million-scale tables without retrieval and distillation".
#   Capping it at 50k would have thrown away the model's main advantage AND
#   handicapped it 20x against v3 — an un-paired cross-family comparison,
#   the same error class as the untuned-vs-trained cap bug fixed today.
#   Our corpus tops out at 532k rows and <=64 features (sanitize.max_columns),
#   so 1M means "no cap in practice" for both families. Their wrappers
#   auto-estimate a safe batch size (polynomial memory regression), so OOM
#   is unlikely; WALLTIME is the thing to watch on the first run.
max_rows_per_model:
  v3:      1000000
  v2.6:    50000
  tabicl:  1000000
  default: 50000


# Per-fold Optuna budget for the tuned baselines. HPO objective is scored on
# the inner-val split. max_rows = stratified subsample of the train fold used
# during HPO only (final fit sees the full fold). n_trials=50 for ALL four so
# a TabPFN "win" can't be dismissed as under-tuned baselines (2026-06-24):
# xgboost/catboost tune their full param space; logreg/linreg tune the
# regularization strength (C / alpha) that dominates a linear model on
# collinear credit features.
hpo:
  xgboost:  {n_trials: 50, timeout_seconds: 900, max_rows: 50000}
  catboost: {n_trials: 50, timeout_seconds: 900, max_rows: 50000}
  logreg:   {n_trials: 50, timeout_seconds: 300}
  linreg:   {n_trials: 50, timeout_seconds: 300}


# TabPFN inference-time ensemble size (sklearn API), shared by untuned and
# trained variants. Matches the per-epoch training monitor so eval numbers
# are directly comparable to the training curves.
tabpfn_n_estimators: 32

# TabICL inference-time ensemble size — SEPARATE knob because TabICL's ICL
# attention is quadratic in rows and 32 members would multiply an already
# steeper cost. 8 is upstream's own default (TabICLClassifier/Regressor).
# Both families' untuned and trained variants use their family's value, so
# each trained-vs-untuned comparison stays internally paired.
tabicl_n_estimators: 8


# Output root. Benchmark CSVs land under <base_dir>/<TRACK>/<method>/...
results:
  base_dir: "output/results"
