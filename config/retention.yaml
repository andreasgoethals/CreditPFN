# Non-credit TabArena panels. `research` measures forgetting (never trained on);
# The matched domain-control training corpus (E4) is generated separately: config/domain_control.yaml.
#
# research: every TabArena-v0.1 table (OpenML curated versions, study 457) with fewer than
# 50,000 rows that is binary classification (track pd) or regression (track lgd), excluding
# tables that overlap the credit corpus and three credit-like tables:
#   corpus overlap: 46918 credit-g, 46932 (same source as a corpus table),
#                   46919 credit_card_clients_default, 46929 GiveMeSomeCredit
#   credit-like:    46962 taiwanese_bankruptcy_prediction, 46950 polish_companies_bankruptcy,
#                   46938 Is-this-a-good-customer
# Multiclass tables are excluded; kddcup09_appetency has exactly 50,000 rows and is excluded.
# Source: TabArena Table B.2, tfm-library/supporting-references/text/2025/2025_TabArena_*.txt.
# `tabarena` repeats Table B.2's N, d and C (null for regression); preparation checks N.
#
# The OpenML default target is used. `preprocessing: credit_sanitize` applies the credit
# tables' sanitize pipeline (config/data.yaml: 64-column unsupervised feature cap, float32,
# constant/duplicate/high-missing column drops) without the credit LGD [0, 1] target clip.
# `version`/`license`, when absent, are recorded from OpenML at first preparation; the
# OpenML data_id already identifies one dataset version.
smoke:
  - {id: package_breast_cancer, track: pd, source: sklearn, name: breast_cancer}
  - {id: package_diabetes, track: lgd, source: sklearn, name: diabetes}
research:
