# PROPOSED non-credit retention panel for the second campaign (status: needs Andreas's decision).
# Source: TabArena-v0.1 Table B.2 (tfm-library/supporting-references/text/2025/2025_TabArena_*.txt),
# OpenML dataset IDs. Rule: fewer than 25,000 rows; no overlap with the 25-table credit corpus.
# Monitored at every trajectory point with one fixed context/query split per table.
#
# Findings that need a decision:
#  * TabArena-v0.1 has only 13 regression datasets; 10 have < 25,000 rows. Twenty regression
#    tables require a second suite (OpenML-CTR23, 35 regression tasks) or a larger row limit.
#  * Binary classification gives 17 tables; reaching 20 needs multiclass tables (marked below)
#    or the borderline credit-like tables.
#  * Exclusions: credit-g (= PD German Credit), heloc (same source as LGD heloc),
#    credit_card_clients_default / GiveMeSomeCredit (= PD Taiwan / GMSC, also > 25k rows).
#    Borderline (credit-adjacent, excluded by default): taiwanese_bankruptcy_prediction,
#    polish_companies_bankruptcy, Is-this-a-good-customer.

