# EXPERIMENT 1 · LGD — does continued pretraining help, averaged over dataset splits?
# Delta over config/train.yaml. Row/feature caps: config/data.yaml. Eval: config/eval.yaml.

# ---------------------------------------------------------------- SWEPT ------
tunable:
  learning_rates: [3.0e-7, 1.0e-6, 1.0e-5]            # Garg -> our best -> Kolberg/Tanna
  l2sp_lambdas: [0.003]       # FIXED at Garg's value, not swept: the budget bought back `accumulate`
  frozen_backbone: [false, true]                      # head only, or every weight
  epoch_pass_modes: ["full_pass", "accumulate"]   # per-batch updates vs ONE averaged
  #   update per dataset, so a 730k-row table cannot outvote a 999-row one
  query_fractions: [0.40]
  accumulate_grad_batches: [1]
  adapter_families: []                                # frozen arm for every family

corpus:
  min_train_rows: 0           # not an axis any more: the split draw varies table sizes
  n_test_datasets: 2          # 2 test / 6 train, of 8 LGD datasets
  n_splits: 8                 # 8 draws per track; same count for both, so the error bars compare
  train_dataset_ids: null     # drawn, not pinned
  test_dataset_ids: null

# ---------------------------------------------------------------- FIXED ------
track: "lgd"
run_name: "exp1"

train:
  target_total_steps: 5000    # THE budget. PD banked 95% of its loss drop by ~3550 steps,
                              #   LGD 90% by ~4400, so 5000 clears both measured plateaus.
  epochs: 50                  # only a fallback; the step budget derives the real epoch count
  max_epochs_for_step_budget: 4000   # guard: a 1-step/epoch corpus must not spin forever
  epoch_eval_count: 20        # monitor 20x per run whatever the derived epoch count is
