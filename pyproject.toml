# =============================================================================
#  CreditPFN — project metadata, dependencies, and tool configuration
# =============================================================================
#  Single source of truth for the package. Install editable:
#
#      python -m pip install --upgrade pip
#      pip install -e .                 # runtime only
#      pip install -e ".[dev]"          # + pytest and lint tooling
#      pip install -e ".[dev,notebooks]" # + Jupyter/ipykernel for the notebooks
#
#  The scientific stack is PINNED to the accepted VSC container (env20261029f,
#  config/runtime/env20261029f.pip-lock.txt): local tests must exercise the exact
#  upstream training and inference code the cluster runs. tests/test_environment_parity.py
#  fails on drift. Local install (CPU torch wheel of the same release):
#
#      py -3.13 -m venv .venv
#      .venv\Scripts\python -m pip install --no-deps --extra-index-url https://download.pytorch.org/whl/cpu -r config/runtime/local-cpu.txt
#      .venv\Scripts\python -m pip install --no-deps -e .
#
#  Python 3.13 matches the container (3.13.11). Changing any pin requires a new
#  container, experiment-0 parity controls and a recorded runtime acceptance.
# =============================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creditpfn"
version = "0.1.0"
description = "Continued pretraining of TabPFN v2/v2.6/v3 and TabICLv2 on real credit-risk data — PD (classification) and LGD (regression)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Andreas Goethals", email = "andreas.goethals@kuleuven.be" }]
keywords = ["tabpfn", "tabular", "foundation-models", "credit-risk", "continued-pretraining", "finetuning"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Exact pins of the accepted container's scientific stack (see the header).
dependencies = [
    "torch==2.12.0",
    "tabpfn @ git+https://github.com/PriorLabs/tabPFN.git@27923f45287a680622012acd51a7b29f8b94415a",
    "tabicl==2.1.1",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "scipy==1.17.1",
    "scikit-learn==1.6.1",
    "threadpoolctl==3.6.0",
    "psutil==7.2.2",
    "xgboost==3.2.0",
    "catboost==1.2.10",
    "lightgbm==4.6.0",
    "optuna==4.8.0",
    "omegaconf==2.3.0",
    "huggingface_hub==0.36.2",
    "matplotlib==3.10.9",
    "peft==0.19.1",
]

[project.optional-dependencies]
# Local tests and linting; maintain the shared library in its own checkout.
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6",
]
# Interactive notebooks under notebooks/, and the headless runner that executes
# them in place (src/utils/run_notebooks.py imports nbformat + nbclient directly).
notebooks = [
    "ipykernel>=6.29,<7.0",
    "jupyter>=1.0,<2.0",
    "nbformat>=5.9,<6.0",
    "nbclient>=0.9,<1.0",
]

[project.urls]
Repository = "https://github.com/andreasgoethals/CreditPFN"

[tool.setuptools.packages.find]
# `src` is imported directly as a top-level package (e.g. `import src.train.loop`),
# matching how the scripts and tests reference it. The YAML configs are NOT
# package data — every entrypoint loads them by cwd-relative path
# (`OmegaConf.load("config/data.yaml")`) after cd-ing into the repo root.
include = ["src", "src.*"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    # Read-only submodule. Never lint, never format, never touch.
    "tfm-library", "vsc-library",
    # Generated output and notebook JSON are not source.
    "output",
    "output CreditPFN",
    "archive",
    "notebooks",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]
ignore = [
    "E501",    # line length is the formatter's job, not the linter's
    "B905",    # zip(strict=) noise in numeric code
]

[tool.ruff.lint.per-file-ignores]
# Template idiom: scripts/ are invoked as files, not imported, so they insert the
# repository root on sys.path BEFORE importing from src. That is an import-not-at-top
# by construction.
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# WHY: without this, pytest walks tfm-library/ and tries to collect the upstream
# code snapshots as tests. It finds "test" in filenames there and fails on imports
# of packages this project does not have.
norecursedirs = ["tfm-library", "vsc-library", "output", "output CreditPFN", "archive", "data", "checkpoints", ".venv", "venv", "notebooks"]
markers = [
    "slow: takes more than a few seconds",
    "gpu: requires CUDA; skipped on the local dev machine",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
