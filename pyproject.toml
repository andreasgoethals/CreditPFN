# =============================================================================
#  CreditPFN — project metadata, dependencies, and tool configuration
# =============================================================================
#  Single source of truth for the package. Install editable:
#
#      python -m pip install --upgrade pip
#      pip install -e .                 # runtime only
#      pip install -e ".[dev]"          # + pytest and lint tooling
#      pip install -e ".[dev,notebooks]" # + Jupyter/ipykernel for the notebooks
#
#  Upstream training APIs change. Validate and record the existing environment
#  with compatibility smoke tests and VSC null controls. Do not upgrade a
#  floating upstream branch during an immutable experiment campaign.
#
#  Supported Python versions: 3.11–3.13. Expanding this range requires
#  validating the complete compiled stack and upstream training interfaces.
# =============================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creditpfn"
version = "0.1.0"
description = "Continued pretraining of TabPFN v2/v2.6/v3 and TabICLv2 on real credit-risk data — PD (classification) and LGD (regression)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Andreas Goethals", email = "andreas.goethals@kuleuven.be" }]
keywords = ["tabpfn", "tabular", "foundation-models", "credit-risk", "continued-pretraining", "finetuning"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime compatibility ranges, not a reproducible environment lock. Prepared
# plans record installed versions; upstream training APIs still require the
# experiment-0 compatibility controls before a new environment is used.
dependencies = [
    # Core deep-learning stack
    "torch>=2.3,<3.0",            # torch.amp.GradScaler is exported starting in 2.3
    # TabPFN — validate the installed training API before preparing a campaign.
    "tabpfn>=2.2",
    # The compatibility shim uses private MetaBatch/preprocessing APIs.
    # The finetune extra supplies their optimizer/transformers dependencies;
    # inference-only installations are insufficient. Revalidate API changes.
    "tabicl[finetune]>=2.1.1,<3",
    # Scientific / tabular stack
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "scipy>=1.11,<2.0",            # spatial.distance, stats.spearmanr (eval metrics)
    "scikit-learn>=1.4,<2.0",      # FeatureAgglomeration, OrdinalEncoder, KFold, metrics
    "threadpoolctl>=3.1,<4.0",    # direct CPU-thread controls in training and evaluation
    "psutil>=5.9,<8.0",           # process memory / CPU telemetry
    # Baseline models for the eval benchmark
    "xgboost>=2.0,<4.0",
    "catboost>=1.2,<2.0",
    "optuna>=3.6,<5.0",            # per-fold HPO (TPE) for the boosting baselines
    # Configuration management (plain OmegaConf + Hydra-style CLI dot-overrides)
    "omegaconf>=2.3,<3.0",
    "pyyaml>=6.0,<7.0",           # omegaconf's YAML backend; no direct import in src/
    # Checkpoint staging from the Hugging Face Hub (src/utils/stage_checkpoints.py)
    "huggingface_hub>=0.24,<1.0",
    # pandas dispatches prediction .to_parquet to pyarrow. The writer retains
    # a gzipped-CSV fallback; record the actual format rather than assuming it.
    "pyarrow>=15.0",
    # Plotting (figure export in src/visualize/figures.py + the notebooks)
    "matplotlib>=3.8,<4.0",
    # LoRA adapter (training-time only; merged into base weights at save time)
    "peft>=0.10,<1.0",
]

[project.optional-dependencies]
# Local tests and linting; maintain the shared library in its own checkout.
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6",
]
# Interactive notebooks under notebooks/, and the headless runner that executes
# them in place (src/utils/run_notebooks.py imports nbformat + nbclient directly).
notebooks = [
    "ipykernel>=6.29,<7.0",
    "jupyter>=1.0,<2.0",
    "nbformat>=5.9,<6.0",
    "nbclient>=0.9,<1.0",
]

[project.urls]
Repository = "https://github.com/andreasgoethals/CreditPFN"

[tool.setuptools.packages.find]
# `src` is imported directly as a top-level package (e.g. `import src.train.loop`),
# matching how the scripts and tests reference it. The YAML configs are NOT
# package data — every entrypoint loads them by cwd-relative path
# (`OmegaConf.load("config/data.yaml")`) after cd-ing into the repo root.
include = ["src", "src.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    # Read-only submodule. Never lint, never format, never touch.
    "tfm-library", "vsc-library",
    # Generated output and notebook JSON are not source.
    "output",
    "output CreditPFN",
    "archive",
    "notebooks",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]
ignore = [
    "E501",    # line length is the formatter's job, not the linter's
    "B905",    # zip(strict=) noise in numeric code
]

[tool.ruff.lint.per-file-ignores]
# Template idiom: scripts/ are invoked as files, not imported, so they insert the
# repository root on sys.path BEFORE importing from src. That is an import-not-at-top
# by construction.
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# WHY: without this, pytest walks tfm-library/ and tries to collect the upstream
# code snapshots as tests. It finds "test" in filenames there and fails on imports
# of packages this project does not have.
norecursedirs = ["tfm-library", "vsc-library", "output", "output CreditPFN", "archive", "data", "checkpoints", ".venv", "venv", "notebooks"]
markers = [
    "slow: takes more than a few seconds",
    "gpu: requires CUDA; skipped on the local dev machine",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
